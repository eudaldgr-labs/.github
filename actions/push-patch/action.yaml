name: Push patch
description: Commit a patch from collect-patch as a GitHub App bot, push it and optionally open or update a pull request

inputs:
  client-id:
    description: Client ID of the GitHub App that commits
    required: true
  private-key:
    description: Private key of the GitHub App that commits
    required: true
  paths:
    description: Same pathspecs as collect-patch; anything else in the patch is left out
    required: true
  artifact:
    description: Artifact name used by collect-patch
    default: patch
  ref:
    description: Commit to build on; defaults to the pull request head
    default: ""
  branch:
    description: Branch to push; defaults to the pull request head branch
    default: ""
  force:
    description: Force-push a bot-owned branch (never for branches other authors push to)
    default: "false"
  commit-message:
    description: Commit message
    default: "chore: regenerate generated files"
  pr-title:
    description: Open or update a pull request against the default branch with this title
    default: ""
  pr-body-file:
    description: File inside the artifact used as the pull request body
    default: ""
  pr-labels:
    description: Comma-separated labels for a new pull request
    default: ""

runs:
  using: composite
  steps:
    - id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/push-patch

    # The patch comes from a job that ran dependency code. Only `paths` are staged,
    # so anything else it changes stays out of the commit.
    - name: Commit and push
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        BRANCH: ${{ inputs.branch || github.event.pull_request.head.ref }}
        FORCE: ${{ inputs.force }}
        MESSAGE: ${{ inputs.commit-message }}
        PATHS: ${{ inputs.paths }}
        TITLE: ${{ inputs.pr-title }}
        BODY_FILE: ${{ inputs.pr-body-file }}
        LABELS: ${{ inputs.pr-labels }}
      run: |
        set -euo pipefail
        test -n "${BRANCH}"
        dir="${RUNNER_TEMP}/push-patch"
        git apply "${dir}/changes.patch"
        sed '/^[[:space:]]*$/d' <<< "${PATHS}" | git add --pathspec-from-file=-
        git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
        user_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
        git -c user.name="${APP_SLUG}[bot]" -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
          commit --quiet --message "${MESSAGE}"
        gh auth setup-git
        flags=()
        [[ "${FORCE}" == true ]] && flags+=(--force)
        git push "${flags[@]}" origin "HEAD:refs/heads/${BRANCH}"
        [[ -n "${TITLE}" ]] || exit 0
        body=(--body "${MESSAGE}")
        [[ -n "${BODY_FILE}" ]] && body=(--body-file "${dir}/${BODY_FILE}")
        number="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
        if [[ -n "${number}" ]]; then
          gh pr edit "${number}" --title "${TITLE}" "${body[@]}"
        else
          label=()
          [[ -n "${LABELS}" ]] && label=(--label "${LABELS}")
          gh pr create --head "${BRANCH}" --title "${TITLE}" "${body[@]}" "${label[@]}"
        fi
