---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN until the organisation has its own GitHub App: a release
      # pull request opened with it does not start the CI workflow, so merge it
      # by hand. Swap in actions/create-github-app-token with BOT_CLIENT_ID and
      # BOT_APP_PRIVATE_KEY once the App exists.
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
